<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini League HQ</title>
    <meta name="description" content="Standings, weekly awards, head-to-head and season stats for our FPL mini-league." />

    <!-- Favicon — SVG for modern browsers, PNG fallback for everyone else,
         plus the iOS home-screen icon and a manifest for "Add to Home Screen". -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1c0021" />

    <!-- Open Graph / Twitter — so a link dropped in the group chat shows a
         real title, description and image instead of a bare URL. Replace
         og:url with the actual deployed domain once it's final. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mini League HQ" />
    <meta property="og:description" content="Standings, weekly awards, head-to-head and season stats for our FPL mini-league." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mini League HQ" />
    <meta name="twitter:description" content="Standings, weekly awards, head-to-head and season stats for our FPL mini-league." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
