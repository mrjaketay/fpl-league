name: Refresh FPL Data

on:
  schedule:
    # Every 30 minutes. GitHub Actions schedules can lag a few minutes
    # during busy periods — fine for our purposes.
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend refresh endpoint
        run: |
          curl -X POST "${{ secrets.BACKEND_URL }}/api/cron/refresh" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -f -s -o /dev/null -w "Status: %{http_code}\n"
