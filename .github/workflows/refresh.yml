name: Refresh FPL Data

on:
  schedule:
    # Every 10 minutes. Render's free web service sleeps after 15 minutes
    # of no traffic — pinging every 30 min (my original interval) meant
    # the backend was actually asleep most of the time between pings,
    # causing the ~50s cold-start delay I noticed. Every 10 minutes
    # keeps it reliably awake, with margin for GitHub Actions' scheduling
    # lag (it doesn't guarantee exact timing, especially on private repos).
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # lets me trigger it manually from the Actions tab too

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend refresh endpoint
        run: |
          curl -X POST "${{ secrets.BACKEND_URL }}/api/cron/refresh" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -f -s -o /dev/null -w "Status: %{http_code}\n"
